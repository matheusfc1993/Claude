version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clinic_financial_ai_db
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password_dev
      POSTGRES_DB: clinic_financial_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinic_financial_ai_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
